name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny all permissions by default; each job requests only what it needs.
permissions: {}

jobs:
  ci:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-ci.yml@dd7b8424ba3869283fab81f60aaec75cdac3168e # v2.9.6
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      actions: read
      checks: write
    with:
      pixi-environment: "ci"
      python-versions: '["3.12"]'
      os-matrix: '["ubuntu-latest"]'
      enable-performance: false
      enable-hygiene-check: true
      editable-install: true
      package-path: "."
      allowed-licenses: "MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC, PSF-2.0, LGPL-3.0"
    secrets: inherit

  security-scanning:
    name: "Security Scanning"
    runs-on: ubuntu-latest
    permissions: {}
    needs: [ci]
    if: always()
    steps:
      - name: Check security status
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "Security scanning failed"
            exit 1
          fi
          echo "Security scanning passed"

  branch-policy:
    name: "Branch Policy"
    runs-on: ubuntu-latest
    permissions: {}
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "development" ]; then
            echo "PRs to main must come from development branch"
            exit 1
          fi

  ci-success:
    name: "CI Success"
    runs-on: ubuntu-latest
    permissions: {}
    needs: [ci]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "CI failed with result: ${{ needs.ci.result }}"
            exit 1
          fi
