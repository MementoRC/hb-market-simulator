name: Security
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '0 2 * * 0'   # weekly, Sunday 02:00 UTC (preserves existing cadence)
permissions:
  contents: read
jobs:
  security:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-security.yml@8fcfe680187b5cdd3ebaaf6bacf4dcc1a9194d3d  # v3.0.0
    permissions:
      contents: read
      actions: read
      id-token: write
    secrets: inherit
