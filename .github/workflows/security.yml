name: Security
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: '0 2 * * 0'   # weekly, Sunday 02:00 UTC (preserves existing cadence)
permissions:
  contents: read
jobs:
  security:
    uses: Claire-s-Monster/ci-framework/.github/workflows/reusable-security.yml@25ad0a2c057acc40487d6811d485c69998a7f04f  # v2.9.8
    permissions:
      contents: read
      actions: read
      id-token: write
    secrets: inherit
