[project]
name = "hb-market-simulator"
dynamic = ["version"]
description = "Composable market simulation framework for hummingbot strategy testing"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "aiohttp>=3.8.0",
    "pandas>=1.0.0",
    "pydantic>=2",
    "numpy>=1.20.0",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "market_simulator/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["market_simulator"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
aiohttp = ">=3.8.0"
pandas = ">=1.0.0"
pydantic = ">=2"
numpy = ">=1.20.0"

[tool.pixi.feature.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = "*"
pytest-mock = "*"
ruff = "*"
mypy = "*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest tests/"
test-unit = "pytest tests/unit/"
lint = "ruff check market_simulator tests"
format = "ruff format market_simulator tests"
format-check = "ruff format --check market_simulator tests"
quality = { depends-on = ["lint", "format-check"] }
check = { depends-on = ["quality", "test"] }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hummingbot.supersedes]
test_paths = []
exchanges = []
