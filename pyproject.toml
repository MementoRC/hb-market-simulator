[project]
name = "hb-market-simulator"
dynamic = ["version"]
description = "Composable market simulation framework for hummingbot strategy testing"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "aiohttp>=3.8.0",
    "bidict>=0.22.0",
    "pandas>=1.0.0",
    "pydantic>=2",
    "numpy>=1.20.0",
    "hb-event-bus @ git+https://github.com/MementoRC/hb-event-bus.git@7e2538f21af739c119dd44f3934a8dc48586254c",
]

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "market_simulator/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["market_simulator"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
aiohttp = ">=3.8.0"
bidict = ">=0.22.0"
pandas = ">=1.0.0"
pydantic = ">=2"
numpy = ">=1.20.0"
cython = ">=3"
wheel = ">=0.37.0"

[tool.pixi.feature.dev.dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = "*"
pytest-mock = "*"
pytest-xdist = "*"
pytest-timeout = "*"
ruff = "*"
mypy = "*"

[tool.pixi.feature.ci.dependencies]
ruff = ">=0.1.6"
mypy = ">=1.5.1"
pytest = ">=7.0.0"
pytest-cov = ">=4.1.0"
bandit = ">=1.8.0"
pre-commit = ">=2.15.0"
types-setuptools = "*"

[tool.pixi.feature.quality-extended.dependencies]
bandit = ">=1.8.0"
pip-audit = "*"
filelock = "*"

[tool.pixi.feature.quality-extended.tasks]
security-scan = "bandit -c pyproject.toml -r market_simulator/"
safety-check = "pip-audit"

[tool.pixi.feature.quality-ci.dependencies]
python-build = "*"
hatchling = "*"

[tool.pixi.feature.quality-ci.tasks]
build = "python -m build"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }
quality-extended = { features = ["quality-extended"], solve-group = "default" }
quality-ci = { features = ["quality-ci"], solve-group = "default" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

[tool.pixi.tasks]
test = "pytest tests/"
test-unit = "pytest tests/unit/"
test-integration = "pytest tests/integration"
lint = "ruff check market_simulator tests"
format = "ruff format market_simulator tests"
format-check = "ruff format --check market_simulator tests"
typecheck = "mypy market_simulator"
type-check = "mypy market_simulator"
security = "bandit -c pyproject.toml -r market_simulator/"
quality = { depends-on = ["lint", "format-check"] }
check = { depends-on = ["quality", "test"] }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "asyncio: marks tests as asyncio tests",
]
timeout = 300
timeout_method = "thread"
addopts = "--strict-markers --strict-config"
minversion = "7.0"
log_cli = true
log_cli_level = "DEBUG"

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["market_simulator", "tests"]
omit = ["market_simulator/__about__.py"]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = true
skip_empty = true
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = false
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B105", "B107"]

[tool.hummingbot.supersedes]
test_paths = []
exchanges = []
